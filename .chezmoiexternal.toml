[".config/vim/autoload/plug.vim"]
    type = "file"
    url = "https://raw.githubusercontent.com/junegunn/vim-plug/master/plug.vim"
    refreshPeriod = "168h"
[".config/hammerspoon/Spoons/TextExpansion.spoon"]
    type = "git-repo"
    url = "https://github.com/shayneholmes/hammerspoon-TextExpansion.git"
["bin/duplicacy"]
    {{ with . -}}
    {{ $version := "3.2.5" -}}
    {{ $os := .chezmoi.os | replace "darwin" "osx" -}}
    {{ $arch := .chezmoi.arch | replace "amd64" "x64" -}}
    type = "file"
    executable = true
    url = "https://github.com/gilbertchen/duplicacy/releases/download/v{{$version}}/duplicacy_{{$os}}_{{$arch}}_{{$version}}"
    {{ end -}}
["bin/yt-dlp"]
    type = "file"
    url = "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos"
